<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="拾光记 · 以一条时间线串起记录、学习、规划与档案" />
    <meta name="theme-color" content="#f8f9fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f121a" media="(prefers-color-scheme: dark)" />
    <title>拾光记 · Chronicles of Time</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%234a6cf7'/%3E%3Ctext%20x='16'%20y='23'%20font-size='18'%20font-family='Arial'%20font-weight='700'%20text-anchor='middle'%20fill='white'%3E%E6%8B%BE%3C/text%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cot-theme')
          var theme = saved === 'light' || saved === 'dark' ? saved : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light') }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
