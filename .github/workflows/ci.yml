name: 拾光记 CI

# 纯文档变更不跑构建；同一提交里只要还有代码改动就仍会触发。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# 两个 job 独立并行、互不影响，未使用 matrix，因此无需 fail-fast: false
# （任一 job 失败不会取消另一个，失败信息都会完整保留）。
jobs:
  backend:
    name: 后端 · 测试与打包
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: back-end-spring-cloud/**/pom.xml

      # 真跑测试：父 POM 已声明 spring-boot-starter-test，不加 -DskipTests
      - name: 运行单元测试
        run: mvn -B -f back-end-spring-cloud/pom.xml test

      - name: 打包可执行 jar（测试已跑过，此处不再重复）
        run: mvn -B -f back-end-spring-cloud/pom.xml package -DskipTests

      - name: 上传可执行 jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: back-end-spring-cloud/launcher/target/*.jar
          if-no-files-found: warn

  frontend:
    name: 前端 · 依赖与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: 安装依赖（npm ci）
        working-directory: front-end
        run: npm ci

      - name: 构建静态产物
        working-directory: front-end
        run: npm run build

      - name: 上传 dist 产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front-end/dist/
          if-no-files-found: warn
