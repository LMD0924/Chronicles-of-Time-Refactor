# 拾光记前端静态托管 + 后端反向代理
# backend / mysql / redis / web 均由 deploy/docker-compose.yml 定义，
# 同一 compose 网络内可直接用服务名 backend 做 DNS 解析。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart.max-file-size (20MB) 对齐
    client_max_body_size 20m;

    # 带内容 hash 的构建产物可长期强缓存（^~ 优先于下方正则，避免被抢匹配）
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其它静态资源（图片 / 字体 / favicon 等）
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 后端 REST 接口：proxy_pass 不带尾斜杠，保留 /api/v1/... 原始路径
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端上传文件读取（StaticResourceConfig 映射 /files/**）
    location ^~ /files/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 路由回退：找不到真实文件时交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，避免发版后浏览器仍引用旧的构建资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
