# 生产 profile：所有敏感值必须由环境变量提供，配置文件内不留任何开发默认值。
# 启动：java -jar cot-launcher-0.1.0-SNAPSHOT.jar --spring.profiles.active=prod
# 变量清单见项目根 .env.example，部署细节见 docs/部署指南.md
spring:
  datasource:
    url: ${COT_DB_URL}
    username: ${COT_DB_USER}
    password: ${COT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${COT_DB_POOL_SIZE:20}
      minimum-idle: ${COT_DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: cot-pool
  data:
    redis:
      host: ${COT_REDIS_HOST:localhost}
      port: ${COT_REDIS_PORT:6379}
      password: ${COT_REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

server:
  port: ${COT_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    threads:
      max: 200
    max-connections: 8192
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024

cot:
  auth:
    # 无默认值：环境变量缺失时启动直接失败，避免误用开发密钥上线
    secret: ${COT_AUTH_SECRET}
    ttl-hours: ${COT_AUTH_TTL_HOURS:12}
  storage:
    dir: ${COT_UPLOAD_DIR:/app/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  # 业务链路目前不依赖 Redis，默认关闭该健康指示器，避免未部署 Redis 时误报 DOWN
  health:
    redis:
      enabled: ${COT_HEALTH_REDIS_ENABLED:false}
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.chroniclesoftime: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${COT_LOG_FILE:/app/logs/cot.log}
